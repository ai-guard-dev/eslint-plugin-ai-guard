name: 'ESLint AI Guard'
description: 'Reliability guardrails for AI-generated code — catch async bugs, floating promises, and AI-specific mistakes in Pull Requests'
author: 'Yash Jadhav'

branding:
  icon: 'shield'
  color: 'blue'

# ─── Inputs ───────────────────────────────────────────────────────────────────

inputs:
  preset:
    description: 'Rule preset to use: recommended | strict | security | agent'
    default: 'recommended'
    required: false

  fail-on:
    description: 'When to fail CI: high | medium | any | none (default: high-confidence issues only)'
    default: 'high'
    required: false

  changed-only:
    description: 'Scan only files changed in this PR (recommended for CI speed)'
    default: 'true'
    required: false

  path:
    description: 'Directory or file to scan'
    default: '.'
    required: false

  upload-sarif:
    description: 'Upload SARIF results to GitHub Code Scanning'
    default: 'true'
    required: false

  github-summary:
    description: 'Write a step summary to the GitHub Actions job summary'
    default: 'true'
    required: false

  working-directory:
    description: 'Working directory for the action (useful for monorepos)'
    default: '.'
    required: false

  package-manager:
    description: 'Package manager to use: auto | npm | pnpm | yarn'
    default: 'auto'
    required: false

  sarif-output:
    description: 'Path to write the SARIF results file'
    default: 'ai-guard-results.sarif'
    required: false

  install-deps:
    description: 'Install project dependencies before scanning'
    default: 'true'
    required: false

  baseline:
    description: 'Path to a committed baseline file (e.g. .ai-guard-baseline.json). When set and changed-only is true, only findings not recorded in the baseline are reported, annotated and uploaded. Requires eslint-plugin-ai-guard >= 1.4.3.'
    default: ''
    required: false

  integrity:
    description: 'Check integrity — detect changes that weaken checks (new suppressions, skipped/removed tests, lowered ESLint/TypeScript/coverage settings, removed CI steps): off | report | enforce. "enforce" fails on high-confidence findings even when fail-on is none. Requires changed-only and full history (actions/checkout fetch-depth: 0). Requires eslint-plugin-ai-guard >= 1.4.3.'
    default: 'off'
    required: false

  inline-suppressions:
    description: 'How inline eslint-disable directives covering AI Guard findings are treated: allow (default; hidden findings are still listed) | require-reason | ignore. Requires eslint-plugin-ai-guard >= 1.4.3.'
    default: ''
    required: false

  base-ref:
    description: 'Explicit base branch or ref for changed-file detection and integrity analysis (e.g. "main"). If omitted, the PR base ref (GITHUB_BASE_REF) is used automatically on pull_request events. Use this on push events or when GITHUB_BASE_REF is not available. Requires eslint-plugin-ai-guard >= 1.4.3.'
    default: ''
    required: false

# ─── Outputs ──────────────────────────────────────────────────────────────────

outputs:
  issues-found:
    description: 'Total number of issues found'
    value: ${{ steps.run-ai-guard.outputs.issues-found }}

  high-confidence-count:
    description: 'Number of high-confidence issues found'
    value: ${{ steps.run-ai-guard.outputs.high-confidence-count }}

  medium-confidence-count:
    description: 'Number of medium-confidence issues found'
    value: ${{ steps.run-ai-guard.outputs.medium-confidence-count }}

  files-scanned:
    description: 'Number of files scanned'
    value: ${{ steps.run-ai-guard.outputs.files-scanned }}

  sarif-file:
    description: 'Path to the generated SARIF file'
    value: ${{ steps.run-ai-guard.outputs.sarif-file }}

  duration-ms:
    description: 'Scan duration in milliseconds'
    value: ${{ steps.run-ai-guard.outputs.duration-ms }}

  integrity-high-count:
    description: 'High-confidence check-integrity findings (only when integrity is report or enforce)'
    value: ${{ steps.run-ai-guard.outputs.integrity-high-count }}

  integrity-advisory-count:
    description: 'Advisory check-integrity findings (only when integrity is report or enforce)'
    value: ${{ steps.run-ai-guard.outputs.integrity-advisory-count }}

# ─── Implementation ───────────────────────────────────────────────────────────

runs:
  using: 'node20'
  main: 'action/entrypoint.js'
