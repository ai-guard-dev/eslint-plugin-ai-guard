# AI Guard — Express / Node.js API Workflow
#
# Optimized for Express/Fastify/Node.js API projects with:
# - Strict preset for API routes (higher security signal)
# - Changed-file scanning
# - Medium-confidence threshold (catches auth issues)

name: AI Guard — Express API

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write
  actions: write

jobs:
  ai-guard:
    name: API Reliability Check
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: AI Guard — Changed files scan (strict for APIs)
        id: scan
        run: |
          npx ai-guard changed \
            --pr \
            --strict \
            --fail-on medium \
            --sarif \
            --sarif-output ai-guard-results.sarif
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}
          GITHUB_OUTPUT: ${{ github.output }}
        continue-on-error: true

      - name: Upload to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ai-guard-results.sarif
          category: ai-guard-express

      # For Express APIs:
      # - no-floating-promise: HIGH (async route handlers must not silently fail)
      # - require-auth-middleware: MEDIUM (routes need auth — strict preset)
      # - no-sql-string-concat: MEDIUM (injection risk)
      # - no-hardcoded-secret: HIGH (credentials in source)
      #
      # Public routes (health, metrics, docs) are automatically excluded
