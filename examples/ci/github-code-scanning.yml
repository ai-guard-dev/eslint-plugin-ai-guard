# AI Guard — GitHub Code Scanning (Minimal Setup)
#
# Drop this into .github/workflows/ai-guard.yml for automatic PR annotations.
# Findings appear in the Security > Code Scanning tab and as inline PR comments.
#
# Requirements:
#   - Actions: write (for step summaries)
#   - Security-events: write (for SARIF upload)
#   - Contents: read

name: AI Guard

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  security-events: write
  actions: write

jobs:
  ai-guard:
    name: Async Reliability
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history required for changed-file detection

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run AI Guard
        id: ai-guard
        run: |
          # Scan only changed files on PRs, full scan on push
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npx ai-guard changed --pr --fail-on high --sarif-output ai-guard-results.sarif
          else
            npx ai-guard run --fail-on high --sarif-output ai-guard-results.sarif
          fi
        continue-on-error: true
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ai-guard-results.sarif
          category: ai-guard
