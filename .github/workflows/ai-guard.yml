name: AI Guard PR Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  security-events: write
  contents: read
  checks: write
  pull-requests: write

jobs:
  ai-guard-scan:
    name: AI Guard Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build AI Guard
        run: npm run build

      - name: Scan changed files with AI Guard
        id: scan
        run: |
          node dist/cli/index.js changed \
            --pr \
            --strict \
            --sarif \
            --sarif-output ai-guard-results.sarif \
            --fail-on none
        continue-on-error: true

      - name: Ensure SARIF file exists (create empty if scan produced no output)
        if: always()
        run: |
          if [ ! -f ai-guard-results.sarif ]; then
            echo "SARIF file not found — creating empty SARIF to allow upload step to succeed"
            cat > ai-guard-results.sarif << 'EOF'
          {
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "version": "2.1.0",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "ai-guard",
                    "version": "1.3.0",
                    "informationUri": "https://github.com/ai-guard-dev/eslint-plugin-ai-guard",
                    "rules": []
                  }
                },
                "automationDetails": { "id": "ai-guard" },
                "results": []
              }
            ]
          }
          EOF
          fi

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: ai-guard-results.sarif
          category: ai-guard
