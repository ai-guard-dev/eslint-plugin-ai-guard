# This workflow demonstrates AI Guard self-scanning.
# It runs ai-guard on its own source code as a credibility check.
# Users can copy the 'ai-guard-scan' job to their own workflows.

name: AI Guard Self-Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6am UTC

permissions:
  # Required for github/codeql-action/upload-sarif
  security-events: write
  contents: read

jobs:
  ai-guard-scan:
    name: Self-Scan (plugin source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

      - name: Scan own source with AI Guard (SARIF)
        run: |
          node dist/cli/index.js run \
            --path src \
            --strict \
            --sarif \
            --sarif-output ai-guard-results.sarif \
            --fail-on none
        continue-on-error: true

      - name: Ensure SARIF file exists
        if: always()
        run: |
          if [ ! -f ai-guard-results.sarif ]; then
            cat > ai-guard-results.sarif << 'EOF'
          {
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "version": "2.1.0",
            "runs": [{"tool":{"driver":{"name":"ai-guard","version":"1.3.0","informationUri":"https://github.com/ai-guard-dev/eslint-plugin-ai-guard","rules":[]}},"automationDetails":{"id":"ai-guard"},"results":[]}]
          }
          EOF
          fi

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: ai-guard-results.sarif
          # category MUST remain "ai-guard" — stable across all runs.
          # This links uploads to a persistent Code Scanning analysis slot,
          # making findings visible in Security → Code scanning.
          category: ai-guard

      - name: Generate HTML report
        run: node dist/cli/index.js report --path src --no-open --output ai-guard-self-report.html
        continue-on-error: true
      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-guard-self-report
          path: ai-guard-self-report.html
          retention-days: 30
