# This workflow demonstrates AI Guard self-scanning.
# It runs ai-guard on its own source code as a credibility check.
# Users can copy the 'ai-guard-scan' job to their own workflows.

name: AI Guard Self-Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6am UTC

jobs:
  ai-guard-scan:
    name: Self-Scan (plugin source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Scan own source with AI Guard
        run: node dist/cli/index.js run --path src --strict
      - name: Generate HTML report
        run: node dist/cli/index.js report --path src --no-open --output ai-guard-self-report.html
      - name: Upload report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-guard-self-report
          path: ai-guard-self-report.html
          retention-days: 30
