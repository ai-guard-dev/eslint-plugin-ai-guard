name: Release

on:
  push:
    tags:
      # Version tags only. The floating major tag (v1) is moved by hand and must not create a release.
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
